# ideasearch 配置
# 报告形态与篇幅
[report]
title = "周观察报告"
output_dir = "output"
max_papers = 8
min_papers = 5
target_words = 600
timezone = "Asia/Shanghai"

# 关注方向：label 展示用，keywords 用于检索、打分，也会变成 Web Search 的查询词
[topics.inference]
label = "推理优化"
keywords = ["kv cache", "speculative decoding", "paged attention", "prefix caching", "quantization", "continuous batching", "prefill", "decode", "inference engine", "vllm", "sglang", "moe serving"]

[topics.serving]
label = "在线模型服务"
keywords = ["model serving", "online serving", "autoscaling", "slo", "latency", "gpu scheduling", "cluster scheduling", "model gateway", "multi-region", "request routing", "capacity planning"]

[topics.hotspot]
label = "热点发布"
keywords = ["deepseek", "superagent", "release", "发布", "openai", "qwen", "llama", "benchmark", "开源模型"]

[topics.competitor]
label = "竞品现状"
keywords = ["bytedance", "seed", "kuaishou", "alibaba", "qwen", "meituan", "moonshot", "minimax", "zhipu"]

[arxiv]
categories = ["cs.LG", "cs.CL", "cs.DC", "cs.AR"]
max_results = 150
days_back = 7
delay_seconds = 3.0
keywords = ["inference optimization", "llm serving", "kv cache", "gpu cluster"]

# 行业动态来源（RSS/Atom）。单个源失败只记警告，不影响整体。
