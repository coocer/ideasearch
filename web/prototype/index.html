<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideasearch · 研究雷达（交互原型 v2）</title>
<style>
  :root{
    --paper:#EFF1EE;
    --surface:#FAFBFA;
    --ink:#14181A;
    --ink2:#59635F;
    --ink3:#8A948F;
    --rule:#D3D9D4;
    --rule-soft:#E3E7E3;
    --signal:#B23A0E;
    --signal-soft:#F3E7E1;
    --cool:#2F5E5B;
    --cool-soft:#E4EDEB;
    --warn:#8A6A1F;
    --display:"Songti SC","SimSun","Georgia",serif;
    --ui:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.72;-webkit-font-smoothing:antialiased}
  a{color:var(--cool)}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--signal);outline-offset:2px}

  .app{display:grid;grid-template-columns:208px 1fr;min-height:100vh}
  .rail{border-right:1px solid var(--rule);padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:26px}
  .brand{font-family:var(--display);font-size:19px;letter-spacing:.02em;line-height:1.2}
  .brand small{display:block;font-family:var(--ui);font-size:11.5px;color:var(--ink3);letter-spacing:0;margin-top:4px}
  .navlist{display:flex;flex-direction:column;gap:1px;margin:0;padding:0;list-style:none}
  .navlist button{width:100%;text-align:left;background:none;border:0;padding:7px 8px;color:var(--ink2);border-left:2px solid transparent;display:flex;justify-content:space-between;gap:8px}
  .navlist button:hover{color:var(--ink)}
  .navlist button[aria-current="page"]{color:var(--ink);border-left-color:var(--signal)}
  .navlist .count{color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
  .railfoot{margin-top:auto;font-size:11.5px;color:var(--ink3);line-height:1.6}
  .railfoot b{display:block;color:var(--ink2);font-weight:500;font-size:11.5px}

  main{padding:34px 44px 80px;max-width:1080px}
  .screen-head{margin-bottom:26px}
  .screen-head h1{font-family:var(--display);font-size:30px;line-height:1.28;margin:0 0 8px;font-weight:600}
  .screen-head p{margin:0;color:var(--ink2);max-width:62ch}
  .mockbadge{position:fixed;right:16px;top:14px;background:var(--surface);border:1px solid var(--rule);color:var(--ink2);font-size:11.5px;padding:4px 9px;z-index:60}

  .block{background:var(--surface);border:1px solid var(--rule);padding:22px 24px;margin-bottom:18px}
  .block h2{font-family:var(--display);font-size:18px;margin:0 0 4px;font-weight:600}
  .block .hint{color:var(--ink2);font-size:13px;margin:0 0 18px}

  label.field{display:block;margin-bottom:14px}
  label.field span{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:5px}
  input[type=text],input[type=password],input[type=number],select,textarea{width:100%;background:#fff;border:1px solid var(--rule);padding:8px 10px;font-family:inherit;font-size:14px;color:var(--ink);border-radius:0}
  input:focus,select:focus,textarea:focus{border-color:var(--ink2)}
  textarea{resize:vertical;min-height:64px;line-height:1.6}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

  .btn{background:none;border:1px solid var(--ink);color:var(--ink);padding:7px 15px}
  .btn:hover{background:var(--ink);color:var(--surface)}
  .btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
  .btn.primary:hover{background:var(--signal);border-color:var(--signal)}
  .btn.signal{border-color:var(--signal);color:var(--signal)}
  .btn.signal:hover{background:var(--signal);color:#fff}
  .btn.small{padding:4px 10px;font-size:13px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .note{font-size:12.5px;color:var(--ink3);margin:10px 0 0}
  .note.warn{color:var(--warn)}

  .list{border-top:1px solid var(--rule)}
  .list-row{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--rule-soft)}
  .list-row .key{font-family:var(--display);font-size:15px}
  .list-row .kw{color:var(--ink2);font-size:12.5px}
  .seg{display:inline-flex;border:1px solid var(--rule)}
  .seg button{border:0;background:none;padding:3px 9px;color:var(--ink2);font-size:12.5px}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
  .chip{display:inline-block;border:1px solid var(--rule);padding:2px 8px;font-size:12.5px;color:var(--ink2);margin:0 6px 6px 0}
  .badge{font-size:12px;padding:1px 7px;border:1px solid var(--rule);color:var(--ink2)}
  .badge.ok{border-color:var(--cool);color:var(--cool);background:var(--cool-soft)}
  .badge.bad{border-color:var(--signal);color:var(--signal);background:var(--signal-soft)}

  .issue-head{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:6px}
  .issue-head h1{font-family:var(--display);font-size:34px;line-height:1.26;margin:0 0 10px;font-weight:600}
  .issue-meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink2);font-size:12.5px}

  /* 三档标尺 */
  .gauge{display:inline-flex;gap:3px;vertical-align:middle}
  .gauge i{display:block;width:20px;height:7px;background:var(--rule)}
  .gauge i.on{background:var(--ink2)}
  .gauge i.top.on{background:var(--signal)}
  .gauge-label{font-size:12px;color:var(--ink2);margin-left:8px}

  .paper{padding:26px 0 24px;border-bottom:1px solid var(--rule)}
  .paper:last-child{border-bottom:0}
  .paper-top{display:flex;gap:14px;align-items:baseline;justify-content:space-between}
  .paper h3{font-family:var(--display);font-size:20px;line-height:1.42;margin:0 0 6px;font-weight:600;max-width:44ch}
  .paper h3 a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
  .paper h3 a:hover{border-bottom-color:var(--ink)}
  .paper-meta{color:var(--ink3);font-size:12px;margin-bottom:10px}
  .oneline{font-size:15.5px;margin:0 0 14px}
  .oneline b{font-weight:600}

  .prose{max-width:68ch}
  .prose p{margin:0 0 10px}
  .prose h4{margin:16px 0 4px;font-size:13px;font-weight:600;color:var(--ink2)}

  details.four{margin-top:10px}
  details.four summary{cursor:pointer;color:var(--ink2);font-size:13px;list-style:none}
  details.four summary::-webkit-details-marker{display:none}
  details.four summary::before{content:"▸ ";color:var(--ink3)}
  details.four[open] summary::before{content:"▾ "}
  details.four .inner{padding:12px 0 2px 16px;border-left:1px solid var(--rule-soft);margin-top:8px}

  /* ---------- 阅读模式 ---------- */
  .reader{position:fixed;inset:0;background:var(--paper);z-index:50;display:none;flex-direction:column}
  .reader.open{display:flex}
  .reader-bar{display:flex;align-items:center;gap:16px;padding:12px 28px;border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:2}
  .reader-bar .back{border:1px solid var(--rule);background:none;padding:5px 12px;color:var(--ink2)}
  .reader-bar .back:hover{border-color:var(--ink);color:var(--ink)}
  .reader-bar .rt{font-size:13px;color:var(--ink2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .reader-progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--signal);width:0}
  .reader-scroll{overflow:auto;flex:1;scroll-behavior:smooth}
  .reader-body{max-width:37em;margin:0 auto;padding:52px 24px 120px}

  .reader-body .kicker{font-size:12.5px;color:var(--ink3);margin-bottom:10px}
  .reader-body h1{font-family:var(--display);font-size:30px;line-height:1.34;margin:0 0 14px;font-weight:600}
  .reader-body .standfirst{font-family:var(--display);font-size:18px;line-height:1.72;color:var(--ink2);margin:0 0 26px;padding-bottom:22px;border-bottom:1px solid var(--rule)}
  .reader-body h2{font-family:var(--display);font-size:20px;margin:38px 0 10px;font-weight:600}
  .reader-body p{font-family:var(--display);font-size:17.5px;line-height:1.95;margin:0 0 16px}
  .reader-body p.lead{font-size:18.5px}
  .reader-body ul{margin:0 0 16px;padding-left:22px}
  .reader-body li{font-family:var(--display);font-size:17px;line-height:1.9;margin-bottom:6px}

  figure{margin:30px 0 26px}
  figure svg{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--rule)}
  figcaption{font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.6}

  .verdict-box{border:1px solid var(--rule);background:var(--surface);padding:18px 20px;margin:34px 0 10px}
  .verdict-box .lbl{font-size:12.5px;color:var(--ink2);margin-bottom:8px}
  .glossary{margin-top:30px;border-top:1px solid var(--rule);padding-top:16px}
  .glossary dt{font-weight:600;font-size:14px;margin-top:10px}
  .glossary dd{margin:2px 0 0;color:var(--ink2);font-size:13.5px}
  mark.cite{background:var(--signal-soft);color:var(--ink);padding:0 3px;border-bottom:1px solid #D9BFB2}

  .drawer{margin-top:14px;border-left:2px solid var(--cool);padding:2px 0 2px 18px}
  .drawer-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .drawer-head h4{margin:0;font-size:13px;font-weight:600}
  .pill{font-size:11.5px;border:1px solid var(--rule);padding:1px 7px;color:var(--ink2)}
  .pill.cool{border-color:var(--cool);color:var(--cool)}
  .loading{color:var(--ink3);font-size:13px}
  .loading::after{content:"";animation:dots 1.1s steps(4,end) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

  .kv{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;font-size:13.5px;margin:8px 0 0}
  .kv dt{color:var(--ink2)}
  .kv dd{margin:0}
  pre.handoff{background:#fff;border:1px solid var(--rule);padding:12px;font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;margin:8px 0 0}

  .news{margin-top:34px}
  .news h2{font-family:var(--display);font-size:19px;margin:0 0 14px;font-weight:600}
  .news-row{display:grid;grid-template-columns:1fr auto;gap:14px;padding:10px 0;border-bottom:1px solid var(--rule-soft);align-items:start}
  .news-row .t{font-size:14.5px}
  .news-row .d{color:var(--ink2);font-size:13px;margin-top:3px;max-width:70ch}
  .news-row .s{color:var(--ink3);font-size:12px;white-space:nowrap}
  .conf{margin-top:30px;border-top:1px solid var(--rule);padding-top:14px;color:var(--ink2);font-size:13px}
  .conf b{color:var(--ink);font-weight:600}

  .bar{height:6px;background:var(--rule);margin:14px 0 8px}
  .bar > i{display:block;height:6px;background:var(--ink);width:0;transition:width .35s ease}
  .gen-status{font-size:13px;color:var(--ink2)}

  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}
    main{padding:24px 20px 60px}
    .row2,.row3{grid-template-columns:1fr}
    .list-row{grid-template-columns:1fr;gap:6px}
    .reader-body{padding:32px 18px 90px}
  }
</style>
</head>

          verdict:3,
          one_line:"把「该用几个并行、怎么切」从经验判断变成可计算的可行域。",
          core_problem:"一次推理分 prefill 与 decode 两段：前者一次性算完输入、产出第一个 token，吃的是算力；后者逐 token 往外吐，吃的是显存带宽。张量并行把单层切开摊到多卡，通信密集；流水并行把不同层分到不同卡，对延迟不敏感。两条路对这两段的敏感度恰好相反，所以「最优并行配置」不是常量，而是随负载形状漂移的函数。工程上长期靠试：换个上下文长度、换个批大小，经验就失效，而重配一次要停机、要重跑压测。",

    return '<div class="screen-head"><h1>研究方向</h1><p>方向决定抓什么、怎么排序。权重会真实影响选材——权重高的方向更容易占满名额。</p></div>'+
      '<div class="block"><div class="list">'+rows+'</div>'+
      '<div class="actions" style="margin-top:16px"><button class="btn small" data-act="noop">添加方向</button></div>'+
      '<p class="note">单方向最多占本期 3 篇，避免某一方向刷屏。方向的关键词也会自动变成 Web Search 的查询词。</p></div>';
  }

  function viewSources(){
    const a = MOCK.sources.arxiv, s = MOCK.sources.search;
    const feeds = MOCK.sources.feeds.map(f =>
      '<div class="list-row"><div><div class="key">'+esc(f.name)+'</div><div class="kw">'+esc(f.kind)+'</div></div>'+
      '<div class="kw" style="word-break:break-all">'+esc(f.url)+'</div>'+
      '<div><span class="badge '+(f.status==="ok"?"ok":"bad")+'">'+(f.status==="ok"?"正常":esc(f.reason||"失败"))+'</span></div></div>').join("");

    return '<div class="screen-head"><h1>数据源</h1><p>三种来源可以只开一种：不想配 arXiv 分类和 RSS 的话，只开 Web Search 就能用。</p></div>'+

      '<div class="block"><h2>Web Search</h2>'+
        '<p class="hint">按研究方向的关键词自动搜网页，不需要你挑站点。跨学科最省事的一条路。</p>'+
        '<div class="row3">'+
          '<label class="field"><span>服务商</span><select><option selected>DeepSeek Search</option><option>Exa</option><option>Tavily</option></select></label>'+
          '<label class="field"><span>每次返回条数</span><input type="number" value="'+s.count+'" readonly></label>'+
          '<label class="field"><span>每日查询上限</span><input type="number" value="'+s.dailyQueries+'" readonly></label>'+
        '</div>'+
        '<p class="note">用同一把 DeepSeek key，端点 <code>'+esc(s.endpoint)+'</code>。按请求计费 $0.75 / 千次，与 token 无关。</p>'+
        '<p class="note">查询词由方向关键词生成，例如「kv cache 2026」。支持 site:/after:/lang: 等算符，可限制只看近一年。</p>'+
        '<div class="actions"><span class="badge ok">已启用</span><button class="btn small" data-act="noop">测试查询</button></div>'+
      '</div>'+

      '<div class="block"><h2>arXiv</h2><p class="hint">按分类抓取，适合 CS / 物理 / 数学这类预印本密集的领域。</p>'+
        a.categories.map(c=>'<span class="chip">'+esc(c)+'</span>').join("")+
        '<div class="row3" style="margin-top:14px">'+
          '<label class="field"><span>单次抓取上限</span><input type="number" value="'+a.maxResults+'" readonly></label>'+
          '<label class="field"><span>请求间隔（秒）</span><input type="number" value="'+a.delay+'" readonly></label>'+
        '</div>'+
        '<p class="note">全文优先用 Fetch 接口把 arxiv.org/html 转成 Markdown；取不到则退回摘要，并在深读里明确标注。</p>'+
      '</div>'+

      '<div class="block"><h2>RSS 源</h2><p class="hint">适合追固定几家媒体或竞品博客；跨学科场景可以一个都不配。</p>'+
        '<div class="list">'+feeds+'</div>'+
        '<div class="actions" style="margin-top:16px"><button class="btn small" data-act="noop">添加源</button></div>'+
      '</div>';
  }

  function viewHistory(){
    const rows = MOCK.history.map(h =>
      '<div class="list-row"><div><div class="key">'+esc(h.title)+'</div><div class="kw">'+esc(h.date)+'</div></div>'+
      '<div class="kw">'+h.papers+' 篇论文 · '+h.news+' 条动态 · 约 '+h.minutes+' 分钟</div>'+
      '<div><button class="btn small" data-act="nav" data-to="issue">查看</button></div></div>').join("");
    return '<div class="screen-head"><h1>历史文章</h1><p>每期都保存当时的配置快照，所以后的方向调整不会影响旧文章的解释。</p></div>'+
      '<div class="block"><div class="list">'+rows+'</div></div>';
  }

  function viewSetup(){
    const s = MOCK.settings, b = s.background;
    const fields = [
      ["role","你的角色","例如：推理平台工程师"],
      ["current_work","当前在做的系统","一到三条。写得越具体，深读的价值判断越具体"],
      ["bottlenecks","现在卡在哪","性能、成本还是效果？最好带上具体数字"],
      ["stack","技术栈与部署环境","决定方案能不能落地"],
      ["near_term_goals","半年内想达成什么","决定「值不值得投入」的时间尺度"],
      ["non_interests","明确不关心的方向","抑制什么都值得关注的废话"]
    ];
    return '<div class="screen-head"><h1>设置</h1><p>配置存在本机，重启后不需要再填。模型接口兼容 OpenAI 协议，可换成任意兼容服务。</p></div>'+
      '<div class="block"><h2>模型</h2><p class="hint">用于摘要、深读与复现方案；同一把 key 也用于 Search 与 Fetch。</p>'+
        '<div class="row2">'+
          '<label class="field"><span>接口地址</span><input type="text" value="'+esc(s.baseUrl)+'"></label>'+
          '<label class="field"><span>模型名</span><input type="text" value="'+esc(s.model)+'"></label>'+
        '</div>'+
        '<label class="field"><span>API Key</span><input type="password" value="'+esc(s.apiKey)+'"></label>'+
        '<div class="actions"><button class="btn small" data-act="test">测试连接</button><span class="note" id="testmsg" style="margin:0">未测试</span></div>'+
      '</div>'+
      '<div class="block"><h2>你的研究背景</h2><p class="hint">深读会引用这里的字段来解释「这篇对你有什么用」。留空的字段不会被引用。</p>'+
        fields.map(f=>'<label class="field"><span>'+esc(f[1])+'</span><textarea>'+esc(b[f[0]])+'</textarea><span class="note">'+esc(f[2])+'</span></label>').join("")+
      '</div>'+
      '<div class="actions"><button class="btn primary" data-act="save">保存</button><span class="note" id="savemsg" style="margin:0"></span></div>';
  }

  const VIEWS = {issue:viewIssue, generate:viewGenerate, topics:viewTopics, sources:viewSources, history:viewHistory, setup:viewSetup};
  const view = document.getElementById("view");
  const navEl = document.getElementById("nav");

  function render(){
    navEl.innerHTML = navHtml();
    view.innerHTML = VIEWS[state.route]();
    if(state.gen) startGenBar();
  }

  /* ================= 阅读模式 ================= */
  const reader = document.getElementById("reader");
  const readerBody = document.getElementById("reader-body");
  const readerTitle = document.getElementById("reader-title");
  const readerScroll = document.getElementById("reader-scroll");
  const readerProgress = document.getElementById("reader-progress");

  function figSvg(kind){
    if(kind === "pareto"){
      return '<svg viewBox="0 0 620 320" role="img" aria-label="可行域示意图">'+
        '<rect x="70" y="20" width="510" height="250" fill="#fff" stroke="#D3D9D4"/>'+
        '<rect x="430" y="20" width="150" height="120" fill="#E3E7E3"/>'+
        '<text x="505" y="86" font-size="12" fill="#8A948F" text-anchor="middle">不可达区间</text>'+
        '<path d="M 90 250 Q 220 120 420 40" fill="none" stroke="#B23A0E" stroke-width="2"/>'+
        '<circle cx="120" cy="232" r="3.5" fill="#59635F"/><circle cx="175" cy="176" r="3.5" fill="#59635F"/>'+
        '<circle cx="250" cy="120" r="3.5" fill="#59635F"/><circle cx="330" cy="78" r="3.5" fill="#59635F"/>'+
        '<circle cx="410" cy="46" r="4.5" fill="#B23A0E"/>'+
        '<text x="70" y="292" font-size="12" fill="#59635F">TTFT →</text>'+
        '<text x="70" y="16" font-size="12" fill="#59635F">ITL ↑</text>'+
      '</svg>';
    }
    return '<svg viewBox="0 0 620 260" role="img" aria-label="复用分布示意图">'+
      '<rect x="60" y="20" width="520" height="180" fill="#fff" stroke="#D3D9D4"/>'+
      '<rect x="70" y="30" width="46" height="170" fill="#B23A0E"/>'+
      '<rect x="122" y="120" width="46" height="80" fill="#59635F"/>'+
      '<rect x="174" y="170" width="46" height="30" fill="#8A948F"/>'+
      '<rect x="226" y="186" width="46" height="14" fill="#8A948F"/>'+
      '<rect x="278" y="192" width="46" height="8" fill="#8A948F"/>'+
      '<rect x="330" y="195" width="46" height="5" fill="#8A948F"/>'+
      '<rect x="382" y="197" width="46" height="3" fill="#8A948F"/>'+
      '<text x="60" y="224" font-size="12" fill="#59635F">复用次数 →</text>'+
      '<text x="60" y="16" font-size="12" fill="#59635F">条目占比</text>'+
      '<text x="93" y="60" font-size="12" fill="#fff" text-anchor="middle">高频档</text>'+
    '</svg>';
  }

  function openReader(pid){
    const d = MOCK.deep[pid];
    if(!d) return;
    state.readerId = pid;
    readerTitle.textContent = d.h1;
    let html = '<div class="kicker">'+esc(d.kicker)+'</div>'+
      '<h1>'+esc(d.h1)+'</h1>'+
      '<p class="standfirst">'+esc(d.standfirst)+'</p>';
    d.sections.forEach(function(sec){
      html += '<h2>'+esc(sec.h)+'</h2>';
      sec.ps.forEach(function(p){ html += '<p>'+p+'</p>'; });
      if(sec.fig){ html += '<figure>'+figSvg(sec.fig.kind)+'<figcaption>'+esc(sec.fig.caption)+'</figcaption></figure>'; }
    });
    html += '<div class="verdict-box"><div class="lbl">读完之后的判断</div>'+gauge(d.verdict)+'</div>';
    html += '<div class="glossary"><h2 style="margin-top:0">术语</h2><dl>'+
      d.jargon.map(j=>'<dt>'+esc(j[0])+'</dt><dd>'+esc(j[1])+'</dd>').join("")+'</dl></div>';
    html += '<div class="actions" style="margin-top:36px">'+
      '<button class="btn primary" data-act="close-reader">读完了，返回</button>'+
      '<button class="btn small" data-act="repro-from-reader" data-id="'+pid+'">生成复现方案</button>'+
      '</div>';
    readerBody.innerHTML = html;
    reader.classList.add("open");
    readerScroll.scrollTop = 0;
    readerProgress.style.width = "0%";
    document.body.style.overflow = "hidden";
    readerScroll.focus();
  }

  function closeReader(){
    reader.classList.remove("open");
    document.body.style.overflow = "";
    state.readerId = null;
  }

  readerScroll.addEventListener("scroll", function(){
    const max = readerScroll.scrollHeight - readerScroll.clientHeight;
    const p = max > 0 ? (readerScroll.scrollTop / max) * 100 : 0;
    readerProgress.style.width = p.toFixed(1) + "%";
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && reader.classList.contains("open")) closeReader();
  });

  /* ================= 生成进度 ================= */
  let genTimer = null;
  function startGenBar(){
    const bar = document.getElementById("bar"), st = document.getElementById("genstatus");
    if(!bar) return;
    bar.style.width = state.gen.p + "%";
    if(st) st.textContent = state.gen.msg;
  }
  function runGenerate(){
    const steps = [[12,"Search：按方向关键词搜网页"],[26,"抓取 arXiv（4 个分类）"],[40,"抓取 RSS 源"],
      [54,"去重与方向归属"],[66,"排序，选出 6 篇"],[80,"生成 4/6 篇摘要"],[92,"生成动态摘要"],[100,"完成"]];
    state.gen = {p:0, msg:"准备中"}; render();
    let i = 0; clearInterval(genTimer);
    genTimer = setInterval(function(){
      const s = steps[i++];
      if(!s){ clearInterval(genTimer); return; }
      state.gen = {p:s[0], msg:s[1]}; startGenBar();
      if(s[0] >= 100){
        clearInterval(genTimer);
        setTimeout(function(){ state.gen = null; state.route = "issue"; render(); }, 600);
      }
    }, 650);
  }

  /* ================= 事件 ================= */
  document.addEventListener("click", function(e){
    const el = e.target.closest("[data-act]");
    if(!el) return;
    const act = el.getAttribute("data-act");

    if(act === "nav"){ state.route = el.getAttribute("data-to"); render(); view.focus(); return; }
    if(act === "weight"){
      const key = el.getAttribute("data-key"), w = parseInt(el.getAttribute("data-w"),10);
      MOCK.topics.forEach(t=>{ if(t.key===key) t.weight=w; });
      render(); return;
    }
    if(act === "read"){ openReader(el.getAttribute("data-id")); return; }
    if(act === "close-reader"){ closeReader(); return; }
    if(act === "repro-from-reader"){
      const id = el.getAttribute("data-id");
      closeReader();
      state.repro[id] = "loading"; render();
      setTimeout(function(){ state.repro[id] = "done"; render(); }, 1000);
      return;
    }
    if(act === "repro"){
      const id = el.getAttribute("data-id");
      state.repro[id] = "loading"; render();
      setTimeout(function(){ state.repro[id] = "done"; render(); }, 1000);
      return;
    }
    if(act === "generate"){ runGenerate(); return; }
    if(act === "copy"){
      const pre = document.getElementById("handoff-"+el.getAttribute("data-id"));
      if(pre && navigator.clipboard){ navigator.clipboard.writeText(pre.textContent).then(function(){
        el.textContent = "已复制"; setTimeout(function(){ el.textContent = "复制提示词"; }, 1500); }); }
      return;
    }
    if(act === "test"){
      const msg = document.getElementById("testmsg");
      msg.textContent = "连接中…";
      setTimeout(function(){ msg.textContent = "连接正常，模型与 Search 均可用"; }, 800);
      return;
    }
    if(act === "save"){
      document.getElementById("savemsg").textContent = "已保存到本机，重启后仍然有效";
      document.getElementById("railmsg").textContent = "配置已保存";
      return;
    }
    if(act === "noop"){
      const orig = el.textContent;
      el.textContent = "原型未实现";
      setTimeout(function(){ el.textContent = orig; }, 1200);
      return;
    }
  });

  document.addEventListener("toggle", function(e){
    const d = e.target.closest("details[data-four]");
    if(d) state.openFour[d.getAttribute("data-four")] = d.open;
  }, true);

  render();
})();
</script>
</body>
</html>
